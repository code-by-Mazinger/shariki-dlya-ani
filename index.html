<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6c6dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Шарики">
<title>Шарики для Ани</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Нежный «девчачий» фон: переливается розовый → лавандовый → персиковый, сверху мягкие светящиеся пятна и блёстки (рисует app.js) */
:root{--ink:#5b3a5e;--ink2:#8a6a8c;--glass:rgba(255,255,255,.38);--edge:rgba(255,255,255,.85);--accent:#e8579a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:linear-gradient(135deg,#ffd6e8 0%,#f3d1ff 35%,#d9d4ff 60%,#ffe0d0 100%);background-size:300% 300%;animation:sky 24s ease-in-out infinite}
@keyframes sky{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#fx{position:fixed;inset:0;pointer-events:none}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:clamp(16px,4.6vw,24px);white-space:nowrap;font-weight:800;letter-spacing:.02em;background:linear-gradient(90deg,#e8579a,#9b5de5);-webkit-background-clip:text;background-clip:text;color:transparent}
#lvl{font-size:14px;color:var(--ink2);font-weight:600}
.btns{display:flex;gap:6px;flex:none}
.ib{width:38px;height:38px;border-radius:13px;border:1.5px solid var(--edge);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:18px;color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(155,93,229,.18);cursor:pointer}
.ib:active{transform:scale(.92)}
.ib.off{opacity:.45}
#board{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:var(--gap,18px) var(--gap,14px);padding:10px 0}
/* пробирка — матовое стекло; шарики стоят снизу вверх */
.tube{position:relative;width:var(--tw,58px);height:calc(var(--tw,58px) * 3.9);border-radius:12px 12px calc(var(--tw,58px) / 2) calc(var(--tw,58px) / 2);
  background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,.2) 40%,rgba(255,255,255,.45));border:2px solid var(--edge);
  box-shadow:inset 0 0 12px rgba(255,255,255,.6),0 6px 18px rgba(155,93,229,.18);transition:transform .18s,box-shadow .18s;cursor:pointer}
.tube.sel{transform:translateY(-10px);box-shadow:inset 0 0 12px rgba(255,255,255,.8),0 0 0 3px rgba(232,87,154,.5),0 10px 24px rgba(232,87,154,.35)}
.tube.done{box-shadow:inset 0 0 16px rgba(255,255,255,.9),0 0 22px var(--glow,#fff)}
.tube.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ball{position:absolute;left:50%;width:calc(var(--tw,58px) * .78);height:calc(var(--tw,58px) * .78);margin-left:calc(var(--tw,58px) * -.39);border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,.35) 18%,var(--c) 42%,var(--d) 100%);
  box-shadow:0 3px 8px rgba(90,40,90,.25),inset 0 -4px 8px rgba(0,0,0,.12);will-change:transform}
.ball.lift{transition:transform .16s ease-out}
.ball.pop{animation:pop .45s ease-out}
/* перламутр: радужный отлив по краю шарика медленно вращается — шарик будто поворачивается (у каждого своя фаза --ph) */
.ball::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;animation:spin 5s linear infinite;animation-delay:var(--ph,0s);
  background:conic-gradient(rgba(255,255,255,0),rgba(255,160,215,.6),rgba(160,205,255,.6),rgba(255,245,170,.55),rgba(170,255,215,.55),rgba(255,255,255,0));
  -webkit-mask:radial-gradient(circle,transparent 45%,#000 80%);mask:radial-gradient(circle,transparent 45%,#000 80%)}
@keyframes spin{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.ball::after{animation:none}}
@keyframes pop{0%{transform:scale(1.35)}60%{transform:scale(.9)}100%{transform:scale(1)}}
/* подсказка главы 2: какие цвета смешиваются */
#legend{display:flex;justify-content:center;gap:14px;margin-top:6px;font-size:13px;color:var(--ink2);font-weight:600}
#legend[hidden]{display:none}
#legend span{display:inline-flex;align-items:center;gap:3px}
#legend i{display:inline-block;width:14px;height:14px;border-radius:50%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.15)}
.rule{display:flex;justify-content:center;align-items:center;gap:8px;font-size:22px;margin:8px 0}
.rule i{display:inline-block;width:34px;height:34px;border-radius:50%;box-shadow:inset -4px -6px 8px rgba(0,0,0,.18),inset 4px 4px 6px rgba(255,255,255,.5)}
/* стартовый экран: котик и «Старт» внизу */
#start{position:fixed;inset:0;z-index:9;background:linear-gradient(160deg,#ffd6e8 0%,#f3d1ff 45%,#ffe0d0 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px calc(env(safe-area-inset-bottom) + 40px)}
#start[hidden]{display:none}
#start .ttl{position:absolute;top:calc(env(safe-area-inset-top) + 9vh);left:0;right:0;text-align:center;font-size:clamp(30px,9vw,46px);font-weight:900;
  background:linear-gradient(90deg,#e8579a,#9b5de5);-webkit-background-clip:text;background-clip:text;color:transparent}
#start .cat{width:min(78vw,380px);margin-bottom:5vh;filter:drop-shadow(0 14px 22px rgba(155,93,229,.3));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#startBtn{font-size:24px;padding:18px 64px;border-radius:22px}
/* окна: победа с блюдом, альбом, просмотр блюда */
.ovl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(255,230,245,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
.ovl[hidden]{display:none}
.card{width:min(440px,94vw);max-height:92vh;overflow:auto;border-radius:24px;background:rgba(255,255,255,.82);border:2px solid #fff;box-shadow:0 20px 60px rgba(155,93,229,.3);
  padding:18px;text-align:center}
.card h2{margin:4px 0 10px;font-size:22px;color:var(--accent)}
.card p{margin:8px 0;line-height:1.45;color:var(--ink)}
.card small{color:var(--ink2)}
.pic{position:relative;border-radius:14px;overflow:hidden;margin:6px auto 10px;box-shadow:0 8px 26px rgba(90,40,90,.25)}
.pic img{display:block;width:100%}
.pic canvas{position:absolute;inset:0;width:100%;height:100%}
.go{margin-top:8px;border:0;border-radius:16px;padding:14px 28px;font-size:18px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(90deg,#f06aa8,#a46cf0);box-shadow:0 8px 20px rgba(232,87,154,.35)}
.go.ghost{background:rgba(255,255,255,.7);color:var(--accent);box-shadow:none;border:2px solid #f3b6d4}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
#grid .cell{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#f6e3f2;border:2px solid #fff;cursor:pointer}
#grid .cell img{width:100%;height:100%;object-fit:cover;display:block}
#grid .cell canvas{position:absolute;inset:0;width:100%;height:100%}
#grid .cell b{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:left;
  background:linear-gradient(transparent,rgba(40,10,40,.6))}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font-size:26px;font-weight:800;color:var(--accent);text-shadow:0 2px 12px #fff;
  pointer-events:none;opacity:0;transition:opacity .3s;z-index:4;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="fx"></canvas><canvas id="fw"></canvas>
<div id="app">
  <header>
    <div><h1>Шарики для Ани</h1><div id="lvl"></div></div>
    <div class="btns">
      <button class="ib" id="undo" aria-label="Отменить ход">↶</button>
      <button class="ib" id="restart" aria-label="Заново">⟳</button>
      <button class="ib" id="gal" aria-label="Альбом">🍰</button>
      <button class="ib" id="snd" aria-label="Звук">♪</button>
    </div>
  </header>
  <div id="legend" hidden><span><i style="background:#ff5468"></i>+<i style="background:#ffdc3c"></i>=<i style="background:#ff9530"></i></span><span><i style="background:#ffdc3c"></i>+<i style="background:#3f86ff"></i>=<i style="background:#4fd36e"></i></span><span><i style="background:#ff5468"></i>+<i style="background:#3f86ff"></i>=<i style="background:#a45cf0"></i></span></div>
  <div id="board"></div>
</div>
<div id="toast"></div>
<div id="start">
  <div class="ttl">Шарики для Ани</div>
  <img class="cat" src="img/cat.svg" alt="Котик">
  <button class="go" id="startBtn">Старт</button>
</div>
<div class="ovl" id="mixIntro" hidden><div class="card">
  <h2>Новое: смешение цветов 🎨</h2>
  <p>Положи <b>основной</b> шарик на другой основной — они сольются в новый цвет. Можно даже в полную пробирку.</p>
  <div class="rule"><i style="background:#ff5468"></i>+<i style="background:#ffdc3c"></i>=<i style="background:#ff9530"></i></div>
  <div class="rule"><i style="background:#ffdc3c"></i>+<i style="background:#3f86ff"></i>=<i style="background:#4fd36e"></i></div>
  <div class="rule"><i style="background:#ff5468"></i>+<i style="background:#3f86ff"></i>=<i style="background:#a45cf0"></i></div>
  <p><small>Цель та же — в каждой пробирке один цвет. Не смешай лишнего: ошибку можно отменить кнопкой ↶.</small></p>
  <button class="go" id="mixGo">Понятно</button>
</div></div>
<div class="ovl" id="win" hidden><div class="card">
  <h2 id="winT"></h2>
  <div class="pic" id="winPic"><img alt=""><canvas></canvas></div>
  <p id="winInfo"></p>
  <div class="row"><button class="go ghost" id="winGal">Альбом</button><button class="go" id="next">Дальше</button></div>
</div></div>
<div class="ovl" id="gallery" hidden><div class="card">
  <h2>Кулинарная книга Ани</h2>
  <small id="galSub"></small>
  <div id="grid"></div>
  <button class="go" id="galBack">Играть</button>
</div></div>
<div class="ovl" id="view" hidden><div class="card">
  <div class="pic" id="viewPic"><img alt=""><canvas></canvas></div>
  <h2 id="viewT"></h2>
  <p id="viewInfo"></p>
  <button class="go ghost" id="viewBack">Назад</button>
</div></div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
